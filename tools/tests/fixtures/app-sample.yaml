    lang: en
    lines: ["2 cups red lentils", "1 large onion, diced", "4 cloves garlic", "2-3 cups chicken broth",
            "1 tbsp olive oil", "salt to taste", "1 cup frobnicated zizzle", "11 cups water",
            "1 tbsp mirin, or lemon juice", "1 pinch salt"]
