# Invented recipes, in the shape export-for-app.py writes a catalogue recipe:
# their shopping items at the base servings.
recipes:
  - id: sample_lentil_soup
    title: { en: Sample lentil soup, ar: شوربة عدس (عينة) }
    servings: 4
    items:
      - { id: red_lentils, amount: 250, unit: g }
      - { id: onion, amount: 1, unit: "" }
      - { id: garlic, amount: 3, unit: "" }
      - { id: chicken_stock, amount: 1250, unit: ml }
      - { id: lemon, amount: 1, unit: "" }
      - { id: olive_oil, amount: 30, unit: ml }
      - { id: salt, amount: 5, unit: g }
  - id: sample_tomato_rice
    title: { en: Sample tomato rice, ar: أرز بالطماطم (عينة) }
    servings: 4
    items:
      - { id: rice, amount: 400, unit: g }
      - { id: tomato, amount: 360, unit: g }
      - { id: onion, amount: 1, unit: "" }
      - { id: olive_oil, amount: 30, unit: ml }
      - { id: salt, amount: 6, unit: g }
  - id: sample_yogurt_dip
    title: { en: Sample yogurt dip, ar: سلطة زبادي (عينة) }
    servings: 4
    items:
      - { id: plain_yogurt, amount: 600, unit: g }
      - { id: garlic, amount: 1, unit: "" }
      - { id: parsley_fresh, amount: 2, unit: tbsp }
      - { id: lemon, amount: 0.5, unit: "" }
      - { id: salt, amount: null, unit: g }

# Invented import pages, as lines: the sample's parity cases.
imports:
