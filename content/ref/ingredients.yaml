# INGREDIENT REFERENCE
# Extends your existing ingredients_ref.json. Names, pack sizes and buy hints
# are ingredient-intrinsic — a bunch of coriander is always a bunch — so they
# are translated ONCE here, not restated in every recipe that uses them.
#
# NO COST FIELD. Price comes from the market feed at render time, keyed on id.
#
# cls is the DEFAULT scaling class. A recipe may override it (water is usually
# continuous, but water for boiling pasta is fixed) — the validator requires
# the override to be explicit.

chicken_whole:
  glyph: chicken
  name: { en: Chicken, whole, ar: فرخة كاملة }
  unit: g
  cls: continuous
  buy: { en: 1 bird, ar: فرخة }

molokhia_frozen:
  glyph: leaf
  name: { en: Molokhia, frozen, ar: ملوخية مجمدة }
  unit: g
  cls: continuous
  pack: 400
  buy: { en: 400 g pack, ar: كيس ٤٠٠ جم }

