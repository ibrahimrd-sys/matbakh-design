# ACTIVITY LEXICON
# The closed vocabulary of cooking verbs, translated ONCE here and never again
# in a recipe. A recipe refers to `chop`; the word itself lives only in this file.
#
# LOCALES
#   en      English
#   ar      Modern Standard — the fallback, and what a formal register would use
#   ar_eg   Egyptian     — the launch dialect
#   ar_lv   Levantine
#   ar_gulf Gulf         — month 13
#
# The reader resolves ar_gulf → ar_eg → ar, so partial dialect coverage degrades
# to a comprehensible word rather than a blank.
#
# EVERY VERB IS DISTINCT WITHIN EACH DIALECT. Two activities reading the same
# word put the same text on two different tiles, and a cook cannot tell the
# steps apart. `matbakh.py lexicon` enforces this — it is an error, not a
# warning. Eight words were changed during the merge to clear collisions:
# toss/stir in Egyptian, zest/peel and grill/roast in Levantine and Gulf,
# cool/chill in Gulf and MSA, season/marinate in MSA.
#
# Generated from cooking-activities.xlsx after review, 1 August 2026.
# 81 activities. Verbs demoted during review are expressed as an activity plus
# a qualifier — see the note at the foot of this file.


