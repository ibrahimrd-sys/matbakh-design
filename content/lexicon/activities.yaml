# ACTIVITY LEXICON
# The closed vocabulary of cooking verbs. Translated ONCE here, never per recipe.
# Adding a language = adding one key to each entry below.
#
# glyph: Tabler icon key for the activity set
# station_hint: typical station, used by the validator to flag odd placements
#
# This file is the authority the validator checks every recipe tile against.
# A tile referencing an activity not listed here is an error, not a warning —
# that is what stops the vocabulary drifting across 500 recipes.

