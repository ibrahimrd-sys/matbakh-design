# ── DEMOTED DURING REVIEW ────────────────────────────────────────────────────
# These were Tier 1 and are now expressed as an activity plus a qualifier. No
# icon, no lexicon entry, no new word to translate. Recipes referring to the old
# keys must be updated to the form on the right.
#
#   joint            → do: slice    qualifier: { en: into pieces, ar: قطّع لقطع }
#   simmer_covered   → do: simmer   qualifier: { en: covered,     ar: مغطى }
#   add_to           → do: add      qualifier: { en: into,        ar: في }
#   pour_over        → do: pour     qualifier: { en: over it,     ar: فوقها }
#   arrange          → do: serve    qualifier: { en: arranged,    ar: مرصوص }
#   alongside        → do: serve    qualifier: { en: alongside,   ar: بجانبها }
#   pickle           → do: ferment  qualifier: { en: pickled,     ar: مخلل }
#
# do_not_stir, to_taste and serve were demoted in review but kept: they have no
# underlying activity to qualify. do_not_stir in particular inverts its verb —
# rendered as `stir` with a qualifier it would read as "stir" on a 44px tile,
# on the one step where stirring splits the dish.
