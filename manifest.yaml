# ─────────────────────────────────────────────────────────────────────────────
# MATBAKH DESIGN — MANIFEST
#
# This is the ONLY file you edit when a screen is added, renamed or retired.
# index.html is generated from it. Do not hand-edit index.html; build.py
# overwrites it.
#
#   python3 build.py          check + regenerate index.html
#   ./publish.sh "message"    check, regenerate, commit, push
#
# What every file in this repository is, and whether to trust it: DIRECTORY.md
# ─────────────────────────────────────────────────────────────────────────────

project:
  name: Matbakh
  name_ar: مطبخ
  tagline: A kitchen instrument that contains recipes, not a recipe app used in
           a kitchen. Everything here is arranged around the counter-top
           posture — hands busy, attention divided, the screen propped an
           arm's length away.
  release: "2026.09.02"        # bump on every publish; shown in the header
  public: false                # false → noindex banner stays on the site

# The headline prototype. Exactly one.
lead:
  file: prototypes/bolognese-iphone.html
  title: Tagliatelle al Ragù — iPhone, cook mode
  blurb: The whole flow, driven end to end by real recipe data. Pre-commit screen
         in three panes — Overview (why this version, cost, nutrition), the arc,
         the basket — into cook mode, one act per card with a frame from the cook
         video, the ingredients it takes and the cut each one wants. Prose is on
         request behind an ⓘ; only the NEVER note speaks unasked. Timers, map,
         scaling at 2 / 4 / 8. Every screen fits the phone — nothing scrolls,
         per philosophy §3.
  tags: [IPHONE, NO SCROLL, EN/AR, 9 PAGES, FRAMES, CUTS, TEMPORARY]

# Deep links for sending a reviewer to one exact step.
deep_links:
  target: prototypes/bolognese-iphone.html
  note: Each link opens the prototype on that page. The hash follows the cook, so
        a reviewer can send back the exact page they are looking at.
  links:
    - { hash: "#recipe", label: "Before cooking — the pre-commit screen" }
    - { hash: "#cook/1", label: "1 · Board — mince the soffritto, 2 mm" }
    - { hash: "#cook/2", label: "2 · Stove — sweat, no colour, 12 min" }
    - { hash: "#cook/3", label: "3 · Stove — render the pancetta, brown the beef" }
    - { hash: "#cook/4", label: "4 · Stove — soffritto in, deglaze with wine" }
    - { hash: "#cook/5", label: "5 · Stove — tomato, and not a drop more" }
    - { hash: "#cook/6", label: "6 · Stove — first simmer, covered, 90 min" }
    - { hash: "#cook/7", label: "7 · Stove — milk, uncovered, 90 min" }
    - { hash: "#cook/8", label: "8 · Stove — the tagliatelle" }
    - { hash: "#cook/9", label: "9 · Serve — tossed through, never on top" }

sections:

  - heading: Screens on their own
    sub: Each one standalone, for reviewing a single surface.
    items:
      - file: prototypes/app-iphone.html
        title: Molokhia — iPhone, linked flow
        blurb: The earlier example, hand-built. Pre-commit recipe screen into cook
               mode, with state carried between the two. Still the only prototype
               carrying the Resume button.
        tags: [IPHONE, 2 SCREENS, ALARM, SWIPE]
      - file: prototypes/recipe-screen-iphone.html
        title: Pre-commit recipe screen
        blurb: Why this version, cost with its date and source, the whole arc
               in thumbnails, shopping list, nutrition as a findable panel,
               shorts to watch first.
        tags: [IPHONE, HAND SCROLL]
      - file: prototypes/cook-mode-tablet.html
        title: Cook mode — tablet
        blurb: The primary posture. Page per station, session-owned timer band
               down the right edge, map on one screen.
        tags: [TABLET, SWIPE]
      - file: prototypes/cook-mode-iphone.html
        title: Cook mode — iPhone
        blurb: Same session logic, one-handed. Tiles stack full width, timers
               move to a strip under the header.
        tags: [IPHONE, SWIPE]

  - heading: Colour experiment
    sub: White base, terracotta chrome, vivid red for danger, vivid green for a
         timer that is running — plus decorative trim.
    items:
      - file: prototypes/cook-mode-tablet-white.html
        title: Cook mode — tablet, white
        blurb: Paper texture removed; digits and photos carry the weight.
               Green = the stove working, red = act now.
        tags: [TABLET, VARIANT]
      - file: prototypes/cook-mode-iphone-white.html
        title: Cook mode — iPhone, white
        blurb: The same palette on the phone, tricolour header trim and
               timer-band edge.
        tags: [IPHONE, VARIANT]

  - heading: Working sheets
    sub: Made to settle one question each, not to be lived with. Listed so
         preflight stops calling them orphans and so a reviewer can find the
         argument behind a decision. They come out when the question is closed.
    items:
      - file: prototypes/tile-comparison.html
        title: What goes in the tile
        blurb: The sheet that argued option C — icons plus a frame from the cook
               video, never photographs instead of icons. The binding constraint
               is the 17px arc thumbnail.
        tags: [WORKING, TEMPORARY]
      - file: prototypes/storyboard-bench-sheet.html
        title: Storyboard bench sheet
        blurb: The bench sheet behind design/storyboard-companion.md.
        tags: [WORKING, TEMPORARY]

reference:
  - { file: DIRECTORY.md,              title: "Directory — what every file here is, and whether to trust it", kind: MARKDOWN }
  - { file: design/philosophy.md,      title: "Design philosophy — settled decisions and open questions",     kind: MARKDOWN }
  - { file: design/authoring-standard.md, title: "Authoring standard — how to enter a recipe",                kind: MARKDOWN }
  - { file: design/tokens.css,         title: "Design tokens — the canonical palette and type scale",         kind: CSS }
  - { file: CHANGELOG.md,              title: "Changelog — what moved, when",                                 kind: MARKDOWN }
  - { file: ATTRIBUTIONS.md,           title: "Attributions — placeholder photography credits",               kind: MARKDOWN }

# Shown in the site footer. Keep honest — reviewers calibrate on these.
caveats:
  - Placeholder photography and the technique clip come from Wikimedia Commons
    (CC) and stand in for shot art direction. No cook video has been shot, so
    every FRAME TO PULL and TO BE SHOT placeholder is the honest state.
  - Icon glyphs are geometric placeholders for the activity set.
  - Prices are illustrative, not sourced.

